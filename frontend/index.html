<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Two theme-colors, not one: a single value leaves the iOS status bar and the
         Android chrome painted with the light-mode accent even in dark mode. These
         mirror --color-bg in frontend/src/index.css for each scheme. -->
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <!-- viewport-fit=cover opts into the area behind the notch and home indicator on a
         standalone-display PWA. Without it the safe-area-inset-* values that index.css
         relies on all resolve to 0px. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Huddle</title>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.huddle.fitness/" />
    <meta property="og:title" content="Huddle" />
    <meta property="og:description" content="Track workouts, sets, and reps for the whole household." />
    <meta property="og:image" content="https://app.huddle.fitness/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Last-resort boot watchdog: shows a static "go to login" escape hatch if the React app
         never manages to render anything, regardless of why. Not a module, not part of the
         bundle -- see boot-watchdog.js's own header for the full reasoning. Placed before the
         main script so its timer starts as early as possible. -->
    <script src="/boot-watchdog.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
