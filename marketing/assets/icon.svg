<!-- Theme-aware browser-tab favicon: the brand kit's white-tile and dark-tile SVG favicons
     merged into one file, so the tab icon follows the viewer's OS/browser setting rather than
     showing a white block on a dark tab bar. Only the tile and the hairline switch; the mark's
     four circles are its fixed identity colours. Safari ignores SVG favicons entirely and falls
     back to favicon.ico, which is why the white .ico still ships.
     Full reasoning: docs/brand/README.md -->
<svg viewBox="126 92 200 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .tile { fill: #FFFFFF }
    .hairline { stroke: #BDB6AF }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #14100E }
      .hairline { stroke: none }
    }
  </style>
  <defs>
    <mask id="creamStrokeMask" maskUnits="userSpaceOnUse" x="126" y="92" width="200" height="200">
      <rect x="126" y="92" width="200" height="200" fill="#FFFFFF"/>
      <circle cx="200" cy="175" r="34" fill="#000000"/>
    </mask>
  </defs>
  <rect class="tile" x="126" y="92" width="200" height="200"/>
  <circle cx="200" cy="175" r="34" fill="#E8734A"/>
  <circle cx="258" cy="168" r="29" fill="#F2A65A"/>
  <circle cx="198" cy="221" r="25" fill="#F2EDE1"/>
  <circle class="hairline" cx="198" cy="221" r="25" fill="none" stroke-width="1.5" mask="url(#creamStrokeMask)"/>
  <circle cx="250" cy="219" r="19" fill="#B5542D"/>
</svg>
