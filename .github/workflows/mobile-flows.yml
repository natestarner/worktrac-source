name: Mobile flows — the app, signed in, on the simulator

# Drives the real iOS app (the unsigned simulator build, against lower) through the flows only the
# app can break: the keyboard over the login form and the reps field, surviving the background and a
# relaunch, the checkout return link, the in-app browser sheet, the share sheet, History's pull to
# refresh. The flows are e2e/mobile/flows/; what they cover and why is docs/architecture/native-apps.md.
#
# - NOT on push or pull_request. It needs the lower test-support key to create a throwaway household
#   (e2e/mobile/seed-household.mjs), and this repo is public. Dispatch it by hand, let
#   mobile-release.yml call it, or let the nightly schedule run it.
# - NIGHTLY at 07:00 UTC, from main, as part of the nightly tier (e2e-tests.md, "Tiers"). It runs
#   before worktrac-deploy's 09:00 lower e2e nightly so the two never load lower at once (this job
#   can take up to 75 min). A scheduled run skips itself when nothing it tests has changed since the
#   last green scheduled run (`changed` below): the macOS job is long, and re-proving the same
#   code every night proves nothing new. A red scheduled run is never skipped past -- the next
#   night runs again. Reports only: a failure emails, and blocks nothing.
# - The key lives in the `mobile-e2e` environment, apart from the signing secrets in mobile-lower /
#   mobile-production, so it can run from any branch while those stay restricted to main.
# - NON-BLOCKING for TestFlight while it builds a track record: mobile-release.yml runs it beside the
#   upload, not before. Make the upload `needs:` it once it has earned that.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: mobile-flows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every trigger but the schedule always runs. A scheduled run compares main against the last
  # green scheduled run and runs only when something the flows exercise moved.
  changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Has anything the flows test changed since the last green nightly?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh api "repos/$REPO/actions/workflows/mobile-flows.yml/runs?event=schedule&status=success&per_page=1"             --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$last" ]; then
            echo "No green scheduled run yet -- running."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/$REPO/compare/$last...${{ github.sha }}" --jq '.files[].filename' || echo "UNKNOWN")
          if echo "$files" | grep -qE '^(frontend/|e2e/mobile/|\.github/workflows/mobile-flows\.yml|\.github/actions/ios-simulator-app/|UNKNOWN$)'; then
            echo "Changed since $last -- running."; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the flows test changed since the last green nightly ($last) -- skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Three runners, two flows each, side by side. On one 3-core runner the six flows shared a simulator
  # whose taps took 3-17s by the end (2026-11-04), and a sheet or prompt one flow left behind could
  # land on the next. Standard runners are free in this public repo, and the Free plan allows 5 macOS
  # jobs at once; each shard builds its own app (~6 min), so the run takes about as long as one shard.
  # The pairs keep the two system-sheet flows (04 browser, 05 share) on different runners.
  flows:
    needs: [changed]
    if: needs.changed.outputs.run == 'true'
    name: flows (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: sign-in-and-relaunch
            flows: 01-sign-in-and-log-a-set 02-background-and-relaunch
          - shard: link-and-browser
            flows: 03-checkout-return-link 04-in-app-browser-sheet
          - shard: share-and-refresh
            flows: 05-export-share-sheet 06-history-pull-to-refresh
    runs-on: macos-15
    timeout-minutes: 75
    environment: mobile-e2e
    defaults:
      run:
        working-directory: frontend
    env:
      NATIVE_API_URL: https://api.dev.huddle.fitness
    steps:
      - name: The lower test-support key is configured
        # Before checkout, so frontend/ (the job's default) doesn't exist yet.
        working-directory: .
        env:
          KEY: ${{ secrets.E2E_TEST_SUPPORT_KEY_LOWER }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add E2E_TEST_SUPPORT_KEY_LOWER to this repo's mobile-e2e environment (the same value worktrac-deploy's lower deploy uses)."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Every flow is in exactly one shard
        # The matrix above lists flows by name, so a new file in e2e/mobile/flows/ would otherwise
        # never run, silently.
        working-directory: .
        run: |
          listed=$(grep -E '^ +flows: ' .github/workflows/mobile-flows.yml | sed 's/^ *flows: //' | tr ' ' '\n' | sort)
          present=$(ls e2e/mobile/flows/*.yaml | xargs -n1 basename | sed 's/\.yaml$//' | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::mobile-flows.yml's shards don't list every flow exactly once."
            diff <(echo "$listed") <(echo "$present") || true
            exit 1
          fi

      - uses: ./.github/actions/ios-simulator-app
        with:
          native-api-url: ${{ env.NATIVE_API_URL }}

      - name: Create a throwaway household per flow on lower
        working-directory: e2e/mobile
        env:
          API_URL: ${{ env.NATIVE_API_URL }}
          E2E_TEST_SUPPORT_KEY: ${{ secrets.E2E_TEST_SUPPORT_KEY_LOWER }}
          # One per file in e2e/mobile/flows/ -- each signs in as MAESTRO_EMAIL_<its number>.
          SEED_COUNT: '6'
        run: node seed-household.mjs

      - name: Signed-in flows
        env:
          # ios-maestro.sh keeps lower warm while the flows run: the gap after seeding outlasts
          # lower's scale-to-zero, and flow 01 signed in against a cold start (native-apps.md).
          LOWER_HEALTH_URL: ${{ env.NATIVE_API_URL }}/actuator/health
          # A flow that ran and failed gets one more attempt: passed / flaky / failed, in the step
          # summary and results.tsv (ios-maestro.sh, native-apps.md).
          RETRY_FAILED_FLOWS: '1'
          SUMMARY_TITLE: ${{ matrix.shard }}
          SHARD_FLOWS: ${{ matrix.flows }}
        run: |
          flows=()
          for f in $SHARD_FLOWS; do flows+=("../e2e/mobile/flows/$f.yaml"); done
          bash scripts/ios-maestro.sh build/Build/Products/Debug-iphonesimulator/App.app mobile-flows-out "${flows[@]}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mobile-flows-${{ matrix.shard }}
          path: frontend/mobile-flows-out/
          retention-days: 30
