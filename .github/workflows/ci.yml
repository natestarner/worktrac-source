name: CI — Build, Test & Promote to Lower

on:
  push:                          # Runs on push to ANY branch
  pull_request:
    branches: [main]             # Also runs when a PR targets main

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/worktrac-backend
  DEPLOY_REPO: ${{ github.repository_owner }}/worktrac-deploy

# Cancel a superseded run on the same branch/PR so rapid pushes don't queue up stale runs --
# except on main, where docker-build/promote-to-lower push to the deploy repo and must never
# be interrupted mid-flight by the next merge's own run starting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ──────────────────────────────────────────────
  # Job 0: Which side(s) actually changed, so backend-ci/frontend-ci can skip real work on a
  # PR/feature-branch push that only touches the other side. Deliberately NOT used to skip
  # these jobs entirely via a job-level `if:` -- always forced to real work on main regardless
  # of what changed (see each job's own steps), since docker-build/promote-to-lower need
  # backend-ci's test suite to have actually run on every merge, not just ones that touch
  # backend/**. Keeping the job itself unconditional and only gating its steps also guarantees
  # it always posts an explicit "success" rather than a job-level "skipped", regardless of any
  # ambiguity in how this repo's branch protection would treat the latter.
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      marketing: ${{ steps.filter.outputs.marketing }}
      # Whether this change touches anything that ships. Only those PRs build the artifacts that
      # main promotes as-is (resolve-tested-build); a docs-only PR stays fast and its merge simply
      # takes the full build.
      deployable: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.marketing == 'true' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # shared/** is on BOTH sides: it holds rule fixtures (shared/record-rules/) that the
          # backend and frontend test suites each run, so a change there must re-run both.
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
            frontend:
              - 'frontend/**'
              - 'shared/**'
            marketing:
              - 'marketing/**'
              - 'scripts/check-marketing.sh'
              - 'scripts/*site-origins*'
              - 'scripts/preview-marketing.sh'
              - 'e2e/marketing-tests/**'
              - 'e2e/playwright.marketing.config.ts'

  # ──────────────────────────────────────────────
  # Job 0b: The degraded-conditions contract (.claude/rules/resilience.md) -- the app must behave
  # the same online, on lie-fi, offline, and against a cold/DB-less/overloaded backend, which stays
  # true only if there is exactly ONE way to do each job. Deliberately UNGATED by the `changes`
  # filter: it also enforces repo-wide policy (every rule file path-scoped, CLAUDE.md under its own
  # line ceiling) that a docs-only PR can break just as easily as a frontend one. Takes ~3s.
  # ──────────────────────────────────────────────
  resilience-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check resilience invariants
        run: bash scripts/check-resilience-invariants.sh

      # Same job, same reasoning, different rule: the design system's primitives are only worth
      # having if they are actually reached for. That rule was documented in #151 and enforced by
      # nothing, and by the time anyone looked the app had six different renderings of the same
      # uppercase section label. Also ~1s, and also deliberately ungated by `changes`.
      - name: Check design primitives are used
        run: bash scripts/check-design-primitives.sh

  # ──────────────────────────────────────────────
  # Job 0c: On a push to main, can we ship the build this code's PR already made and tested?
  #
  # "Protect main" requires a branch to be up to date before it merges, so the merged code is
  # normally byte-for-byte what the PR's CI built and tested. Running mvn verify and rebuilding
  # here again repeated a result that was already proven -- ~10 minutes of every merge. When
  # scripts/resolve-tested-build.sh can prove the match (same git tree, every gating job green,
  # the image named for that exact tree), fast=true: the test jobs below skip their real work and
  # docker-build / promote-to-lower ship the PR's artifacts. Anything it cannot prove falls back
  # to the full build exactly as before, so a wrong answer can only cost time.
  #
  # Runs on every event (the step is what's gated) so the jobs that `need` it are never skipped by
  # a skipped dependency -- backend-ci and frontend-ci are required checks on PRs.
  # ──────────────────────────────────────────────
  resolve-tested-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      fast: ${{ steps.resolve.outputs.fast }}
      run_id: ${{ steps.resolve.outputs.run_id }}
      image_artifact: ${{ steps.resolve.outputs.image_artifact }}
      frontend_artifact: ${{ steps.resolve.outputs.frontend_artifact }}
      marketing_artifact: ${{ steps.resolve.outputs.marketing_artifact }}
    steps:
      - name: Checkout source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Find the PR build that tested this exact code
        id: resolve
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-tested-build.sh

  # ──────────────────────────────────────────────
  # Job 1: Build and test the backend
  # ──────────────────────────────────────────────
  backend-ci:
    runs-on: ubuntu-latest
    needs: [changes, resolve-tested-build]
    defaults:
      run:
        working-directory: ./backend
    # Real work on a branch/PR whose backend changed, and on main unless main is promoting the
    # build its PR already tested (resolve-tested-build) -- then this exact code has passed here.
    env:
      RUN_REAL: ${{ (github.ref == 'refs/heads/main' && needs.resolve-tested-build.outputs.fast != 'true') || (github.ref != 'refs/heads/main' && needs.changes.outputs.backend == 'true') }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # Runs before anything else, and doesn't need JDK/Maven set up first: pure text-file
      # check, so a mismatch fails fast instead of after a full mvn verify.
      - name: Check JDK alignment (pom.xml vs Dockerfile)
        if: env.RUN_REAL == 'true'
        working-directory: .
        run: bash scripts/check-jdk-alignment.sh

      - name: Set up JDK 25
        if: env.RUN_REAL == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        if: env.RUN_REAL == 'true'
        run: mvn verify -B

      - name: Build JAR (skip tests — already ran)
        if: env.RUN_REAL == 'true'
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        if: env.RUN_REAL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

      - name: No backend changes — skipping build/test
        if: env.RUN_REAL != 'true'
        run: echo "No backend/** changes in this push, or main is promoting the build its PR already tested; skipping build and tests."

  # ──────────────────────────────────────────────
  # Job 2: Build and test the frontend
  # ──────────────────────────────────────────────
  frontend-ci:
    runs-on: ubuntu-latest
    needs: [changes, resolve-tested-build]
    defaults:
      run:
        working-directory: ./frontend
    # RUN_REAL: lint + tests, same rule as backend-ci. BUILD_ARTIFACT: a PR that ships anything
    # also builds this side's artifact even when its tests are skipped, so main can promote the
    # PR's complete build instead of rebuilding (resolve-tested-build).
    env:
      RUN_REAL: ${{ (github.ref == 'refs/heads/main' && needs.resolve-tested-build.outputs.fast != 'true') || (github.ref != 'refs/heads/main' && needs.changes.outputs.frontend == 'true') }}
      BUILD_ARTIFACT: ${{ github.event_name == 'pull_request' && needs.changes.outputs.deployable == 'true' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: env.RUN_REAL == 'true' || env.BUILD_ARTIFACT == 'true'
        uses: actions/setup-node@v7
        with:
          # jsdom 30 (a frontend devDependency) requires Node ^22.22.2 || ^24.15.0 || >=26.0.0
          # via its undici dependency (engines: >=22.19.0) -- Node 20 (already past its own
          # EOL as of 2026-04) can't run the test suite. Bumped to the current Active LTS.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: env.RUN_REAL == 'true' || env.BUILD_ARTIFACT == 'true'
        run: npm ci

      # `lint` has been defined in package.json all along but no workflow ever called it, so
      # oxlint only ever ran when someone remembered to run it by hand. Placed before the tests
      # because it is seconds, not minutes, and rules-of-hooks violations make test failures much
      # harder to read.
      - name: Lint
        if: env.RUN_REAL == 'true'
        run: npm run lint

      - name: Run tests
        if: env.RUN_REAL == 'true'
        run: npm test

      - name: Build
        if: env.RUN_REAL == 'true' || env.BUILD_ARTIFACT == 'true'
        run: npm run build

      - name: Drop env-specific config from the deploy artifact
        if: env.RUN_REAL == 'true' || env.BUILD_ARTIFACT == 'true'
        run: rm -f dist/config.json

      # Kept 7 days, not 1: on a PR this is the build main will ship if it merges unchanged
      # (resolve-tested-build), and a PR can sit a few days between its last push and its merge.
      # Past that, main just builds again.
      - name: Upload build artifact
        if: env.RUN_REAL == 'true' || env.BUILD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist/
          # dist/.well-known/apple-app-site-association.json is what lets email links open the iOS app.
          # upload-artifact skips dot-directories by default, which would drop it without a word.
          include-hidden-files: true
          retention-days: 7

      - name: No frontend changes — skipping build/test
        if: env.RUN_REAL != 'true'
        run: echo "No frontend/** changes in this push, or main is promoting the build its PR already tested; skipping tests."

  # ──────────────────────────────────────────────
  # Job 2b: Validate and package the marketing site (huddle.fitness /
  # dev.huddle.fitness). It is plain static HTML with NO build step -- it ships
  # exactly as authored -- so check-marketing.sh is the only thing standing
  # between a typo'd asset path and a 404 in production. Same RUN_REAL and
  # BUILD_ARTIFACT idiom as frontend-ci: real work on main unless main is
  # promoting its PR's tested build, and every shipping PR packages the site so
  # promote-to-lower always has a marketing-build to hand to the deploy repo.
  # ──────────────────────────────────────────────
  marketing-ci:
    runs-on: ubuntu-latest
    needs: [changes, resolve-tested-build]
    env:
      RUN_REAL: ${{ (github.ref == 'refs/heads/main' && needs.resolve-tested-build.outputs.fast != 'true') || (github.ref != 'refs/heads/main' && needs.changes.outputs.marketing == 'true') }}
      BUILD_ARTIFACT: ${{ github.event_name == 'pull_request' && needs.changes.outputs.deployable == 'true' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check marketing site
        if: env.RUN_REAL == 'true'
        run: bash scripts/check-marketing.sh

      - name: Set up Node.js
        if: env.RUN_REAL == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      # Chromium only -- playwright.marketing.config.ts runs both its viewports on it, so
      # installing the other two engines would add ~40s for nothing.
      - name: Install Playwright (chromium)
        if: env.RUN_REAL == 'true'
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A copy filled with the local origins, the way a deploy fills it -- marketing/ itself holds
      # __SITE_ORIGIN__-style placeholders (scripts/fill-site-origins.sh).
      - name: Serve the marketing site
        if: env.RUN_REAL == 'true'
        run: |
          bash scripts/preview-marketing.sh > "$RUNNER_TEMP/marketing-preview.log" 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8099/ > /dev/null && break
            sleep 0.5
          done
          cat "$RUNNER_TEMP/marketing-preview.log"

      - name: Run marketing e2e
        if: env.RUN_REAL == 'true'
        working-directory: ./e2e
        run: npm run test:marketing

      - name: Upload marketing artifact
        if: env.RUN_REAL == 'true' || env.BUILD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: marketing-build
          # marketing/design/ is the Claude Design canvas source, not part of the site -- it must
          # not be uploaded to the Static Web App and served publicly.
          path: |
            marketing/
            !marketing/design/
          retention-days: 7

      - name: No marketing changes — skipping checks
        if: env.RUN_REAL != 'true'
        run: echo "No marketing/** changes in this push, or main is promoting the build its PR already tested; skipping checks."

  # ──────────────────────────────────────────────
  # Job 3: The backend image
  #
  # On a PR that ships anything: build the image, scan it, and keep it as an artifact named for
  # the exact git tree it was built from. It is NOT pushed to the registry -- package-retention.yml
  # keeps only the newest 30 versions, and an image per PR push would age out the one production
  # runs within days.
  #
  # On main: push the PR's image when resolve-tested-build proved this is the same code, otherwise
  # build it here as before. Both paths push the same two tags and then run the same blocking scan
  # and code-scanning upload, so a CVE published between the PR and the merge still stops the
  # deploy, exactly as it always has.
  # ──────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [changes, resolve-tested-build, backend-ci]
    if: (github.event_name == 'pull_request' && needs.changes.outputs.deployable == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      packages: write
      contents: read
      security-events: write
      actions: read
    env:
      FAST: ${{ needs.resolve-tested-build.outputs.fast == 'true' }}
      ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set short SHA and tree
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> $GITHUB_OUTPUT

      # ── PR: build, scan, keep as an artifact ──
      - name: Build image (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          load: true
          tags: worktrac-backend:tested

      # Same severities and Trivy version as the blocking main scan below, as a table: an early
      # warning on the PR. The main scan stays the gate and the only code-scanning upload, so
      # code scanning keeps tracking main exactly as before.
      - name: Scan image for vulnerabilities (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: worktrac-backend:tested
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          version: 'v0.72.0'

      - name: Save image (PR)
        if: github.event_name == 'pull_request'
        run: docker save worktrac-backend:tested | gzip -1 > "$RUNNER_TEMP/backend-image.tar.gz"

      # The name carries the tree, which is resolve-tested-build's proof that this image IS the
      # code main is about to ship, not merely this PR's.
      - name: Upload image artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: backend-image-${{ steps.vars.outputs.tree }}
          path: ${{ runner.temp }}/backend-image.tar.gz
          compression-level: 0
          retention-days: 7

      # ── main: push the tested image, or build it ──
      - name: Log in to GHCR
        if: env.ON_MAIN == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the image the PR tested
        if: env.ON_MAIN == 'true' && env.FAST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.resolve-tested-build.outputs.image_artifact }}
          IMAGE: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/image.zip"
          unzip -q "$RUNNER_TEMP/image.zip" -d "$RUNNER_TEMP/image"
          gunzip -c "$RUNNER_TEMP/image/backend-image.tar.gz" | docker load
          for tag in "$SHORT_SHA" latest; do
            docker tag worktrac-backend:tested "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Extract metadata
        id: meta
        if: env.ON_MAIN == 'true' && env.FAST != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        if: env.ON_MAIN == 'true' && env.FAST != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Scan Docker image for vulnerabilities
        if: env.ON_MAIN == 'true'
        # Pinned to a full commit SHA rather than a mutable tag — verify this is still
        # current before relying on it long-term (see Section 17.3 of the setup guide).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          version: 'v0.72.0'
          # Without this, trivy-action builds the SARIF report with ALL severities
          # regardless of the severity filter above, and exit-code evaluates against
          # that unfiltered set -- so a LOW/MEDIUM finding on any dependency can fail
          # the build even though severity is scoped to CRITICAL,HIGH. Bit us on
          # 2026-07-09 (CVE-2026-10532, a LOW logback finding, failed the build; see
          # CLAUDE.md's Resolved Incident writeup). Documented upstream bug:
          # https://github.com/aquasecurity/trivy-action/issues/309
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && env.ON_MAIN == 'true'
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-scanning'

  # ──────────────────────────────────────────────
  # Job 4: Update the deploy repo (lower branch)
  # Only runs on pushes to main (not feature branches or PRs)
  # ──────────────────────────────────────────────
  promote-to-lower:
    runs-on: ubuntu-latest
    needs: [resolve-tested-build, backend-ci, frontend-ci, marketing-ci, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # A permissions block grants only what it names: actions:read lets the fast path fetch the
    # PR run's artifacts, contents:read keeps the source checkout below working. The deploy repo
    # is reached with DEPLOY_REPO_PAT, not this token.
    permissions:
      contents: read
      actions: read
    env:
      FAST: ${{ needs.resolve-tested-build.outputs.fast == 'true' }}

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: lower
          token: ${{ secrets.DEPLOY_REPO_PAT }}
          path: deploy

      # download-artifact OVERLAYS the new build onto frontend-build/ and never deletes, so every
      # deploy used to leave its hashed assets behind. ~50 deploys of them reached Azure Static Web
      # Apps' 250 MB Free-plan limit and the frontend upload started failing outright
      # (docs/incidents/2026-10-16-swa-asset-accumulation-250mb.md).
      #
      # Keep exactly ONE previous generation -- the assets the outgoing build's sw.js precaches,
      # which is every file in its assets/ -- so a tab still running that build can lazy-load its
      # chunks (xlsx converter, Stripe) across the deploy. Anything older is deleted.
      #
      # Fails SAFE: if sw.js names no assets (its format changed), nothing is pruned.
      - name: Prune frontend assets older than the outgoing build
        run: |
          set -euo pipefail
          cd deploy/frontend-build 2>/dev/null || { echo "No frontend-build yet -- nothing to prune"; exit 0; }
          if [ ! -f sw.js ] || [ ! -d assets ]; then
            echo "No sw.js or assets/ -- nothing to prune"
            exit 0
          fi
          { grep -oE '"assets/[^"]+"' sw.js || true; } | tr -d '"' | sort -u > "$RUNNER_TEMP/keep.txt"
          if [ ! -s "$RUNNER_TEMP/keep.txt" ]; then
            echo "::warning::sw.js lists no assets/ entries -- skipping prune rather than guessing"
            exit 0
          fi
          before=$(du -sm assets | cut -f1)
          find assets -type f | sort | comm -23 - "$RUNNER_TEMP/keep.txt" | xargs -r rm -f
          echo "Kept $(wc -l < "$RUNNER_TEMP/keep.txt") outgoing assets; assets/ ${before} MB -> $(du -sm assets | cut -f1) MB"

      - name: Download frontend build
        if: env.FAST != 'true'
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: deploy/frontend-build

      - name: Download marketing build
        if: env.FAST != 'true'
        uses: actions/download-artifact@v8
        with:
          name: marketing-build
          path: deploy/marketing-build

      # Fast path: the same two artifacts, from the PR run resolve-tested-build proved built this
      # exact code. Extracted with -o over the existing folders, which overlays and never deletes --
      # the same behaviour download-artifact has above, so the prune step's reasoning still holds.
      - name: Download the frontend and marketing builds the PR tested
        if: env.FAST == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_ID: ${{ needs.resolve-tested-build.outputs.frontend_artifact }}
          MARKETING_ID: ${{ needs.resolve-tested-build.outputs.marketing_artifact }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/artifacts/$FRONTEND_ID/zip" > "$RUNNER_TEMP/frontend.zip"
          gh api "repos/${{ github.repository }}/actions/artifacts/$MARKETING_ID/zip" > "$RUNNER_TEMP/marketing.zip"
          mkdir -p deploy/frontend-build deploy/marketing-build
          unzip -q -o "$RUNNER_TEMP/frontend.zip" -d deploy/frontend-build
          unzip -q -o "$RUNNER_TEMP/marketing.zip" -d deploy/marketing-build
          test -f deploy/frontend-build/index.html
          test -f deploy/marketing-build/index.html

      # Both builds hold __SITE_ORIGIN__ / __APP_ORIGIN__ / __SITE_ROBOTS__ placeholders, and every
      # deploy (lower and production) fills them from its own config/<env>/site-origins.env before
      # upload. The fill script travels with the files it fills, so the lower->production promotion
      # carries the matching version and the deploy repo never keeps a copy of its own.
      - name: Checkout source scripts (the deploy-time fill)
        uses: actions/checkout@v7
        with:
          path: source
          sparse-checkout: scripts

      - name: Ship the deploy-time fill and its post-deploy check
        run: |
          mkdir -p deploy/tools
          cp source/scripts/fill-site-origins.sh source/scripts/verify-site-origins.sh deploy/tools/

      - name: Update image tag
        run: |
          echo "${{ needs.docker-build.outputs.short_sha }}" > deploy/manifests/image-tag.txt

      - name: Commit and push to deploy repo lower branch
        run: |
          cd deploy
          git config user.name "CI Bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy ${{ needs.docker-build.outputs.short_sha }} to lower

          Source commit: ${{ github.sha }}
          Source repo: ${{ github.repository }}
          Triggered by: ${{ github.actor }}"
