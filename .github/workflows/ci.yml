name: CI — Build, Test & Promote to Lower

on:
  push:                          # Runs on push to ANY branch
  pull_request:
    branches: [main]             # Also runs when a PR targets main

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/worktrac-backend
  DEPLOY_REPO: ${{ github.repository_owner }}/worktrac-deploy

# Cancel a superseded run on the same branch/PR so rapid pushes don't queue up stale runs --
# except on main, where docker-build/promote-to-lower push to the deploy repo and must never
# be interrupted mid-flight by the next merge's own run starting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ──────────────────────────────────────────────
  # Job 0: Which side(s) actually changed, so backend-ci/frontend-ci can skip real work on a
  # PR/feature-branch push that only touches the other side. Deliberately NOT used to skip
  # these jobs entirely via a job-level `if:` -- always forced to real work on main regardless
  # of what changed (see each job's own steps), since docker-build/promote-to-lower need
  # backend-ci's test suite to have actually run on every merge, not just ones that touch
  # backend/**. Keeping the job itself unconditional and only gating its steps also guarantees
  # it always posts an explicit "success" rather than a job-level "skipped", regardless of any
  # ambiguity in how this repo's branch protection would treat the latter.
  # ──────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      marketing: ${{ steps.filter.outputs.marketing }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            marketing:
              - 'marketing/**'

  # ──────────────────────────────────────────────
  # Job 0b: The degraded-conditions contract (.claude/rules/resilience.md) -- the app must behave
  # the same online, on lie-fi, offline, and against a cold/DB-less/overloaded backend, which stays
  # true only if there is exactly ONE way to do each job. Deliberately UNGATED by the `changes`
  # filter: it also enforces repo-wide policy (every rule file path-scoped, CLAUDE.md under its own
  # line ceiling) that a docs-only PR can break just as easily as a frontend one. Takes ~3s.
  # ──────────────────────────────────────────────
  resilience-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check resilience invariants
        run: bash scripts/check-resilience-invariants.sh

  # ──────────────────────────────────────────────
  # Job 1: Build and test the backend
  # ──────────────────────────────────────────────
  backend-ci:
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ./backend
    env:
      RUN_REAL: ${{ needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # Runs before anything else, and doesn't need JDK/Maven set up first: pure text-file
      # check, so a mismatch fails fast instead of after a full mvn verify.
      - name: Check JDK alignment (pom.xml vs Dockerfile)
        if: env.RUN_REAL == 'true'
        working-directory: .
        run: bash scripts/check-jdk-alignment.sh

      - name: Set up JDK 25
        if: env.RUN_REAL == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        if: env.RUN_REAL == 'true'
        run: mvn verify -B

      - name: Build JAR (skip tests — already ran)
        if: env.RUN_REAL == 'true'
        run: mvn package -DskipTests -B

      - name: Upload JAR artifact
        if: env.RUN_REAL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

      - name: No backend changes — skipping build/test
        if: env.RUN_REAL != 'true'
        run: echo "No backend/** changes in this push; skipping build and tests."

  # ──────────────────────────────────────────────
  # Job 2: Build and test the frontend
  # ──────────────────────────────────────────────
  frontend-ci:
    runs-on: ubuntu-latest
    needs: [changes]
    defaults:
      run:
        working-directory: ./frontend
    env:
      RUN_REAL: ${{ needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: env.RUN_REAL == 'true'
        uses: actions/setup-node@v7
        with:
          # jsdom 30 (a frontend devDependency) requires Node ^22.22.2 || ^24.15.0 || >=26.0.0
          # via its undici dependency (engines: >=22.19.0) -- Node 20 (already past its own
          # EOL as of 2026-04) can't run the test suite. Bumped to the current Active LTS.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: env.RUN_REAL == 'true'
        run: npm ci

      # `lint` has been defined in package.json all along but no workflow ever called it, so
      # oxlint only ever ran when someone remembered to run it by hand. Placed before the tests
      # because it is seconds, not minutes, and rules-of-hooks violations make test failures much
      # harder to read.
      - name: Lint
        if: env.RUN_REAL == 'true'
        run: npm run lint

      - name: Run tests
        if: env.RUN_REAL == 'true'
        run: npm test

      - name: Build
        if: env.RUN_REAL == 'true'
        run: npm run build

      - name: Drop env-specific config from the deploy artifact
        if: env.RUN_REAL == 'true'
        run: rm -f dist/config.json

      - name: Upload build artifact
        if: env.RUN_REAL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

      - name: No frontend changes — skipping build/test
        if: env.RUN_REAL != 'true'
        run: echo "No frontend/** changes in this push; skipping build and tests."

  # ──────────────────────────────────────────────
  # Job 2b: Validate and package the marketing site (huddle.fitness /
  # dev.huddle.fitness). It is plain static HTML with NO build step -- it ships
  # exactly as authored -- so check-marketing.sh is the only thing standing
  # between a typo'd asset path and a 404 in production. Same RUN_REAL idiom as
  # the other two: always forced to real work on main so promote-to-lower
  # always has a marketing-build artifact to hand to the deploy repo.
  # ──────────────────────────────────────────────
  marketing-ci:
    runs-on: ubuntu-latest
    needs: [changes]
    env:
      RUN_REAL: ${{ needs.changes.outputs.marketing == 'true' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check marketing site
        if: env.RUN_REAL == 'true'
        run: bash scripts/check-marketing.sh

      - name: Set up Node.js
        if: env.RUN_REAL == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      # Chromium only -- playwright.marketing.config.ts runs both its viewports on it, so
      # installing the other two engines would add ~40s for nothing.
      - name: Install Playwright (chromium)
        if: env.RUN_REAL == 'true'
        working-directory: ./e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Serve the marketing site
        if: env.RUN_REAL == 'true'
        run: |
          python3 -m http.server 8099 --directory marketing &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8099/ > /dev/null && break
            sleep 0.5
          done

      - name: Run marketing e2e
        if: env.RUN_REAL == 'true'
        working-directory: ./e2e
        run: npm run test:marketing

      - name: Upload marketing artifact
        if: env.RUN_REAL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: marketing-build
          # marketing/design/ is the Claude Design canvas source, not part of the site -- it must
          # not be uploaded to the Static Web App and served publicly.
          path: |
            marketing/
            !marketing/design/
          retention-days: 1

      - name: No marketing changes — skipping checks
        if: env.RUN_REAL != 'true'
        run: echo "No marketing/** changes in this push; skipping checks."

  # ──────────────────────────────────────────────
  # Job 3: Build and push Docker image
  # Only runs on pushes to main (not feature branches or PRs)
  # ──────────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
      security-events: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Scan Docker image for vulnerabilities
        # Pinned to a full commit SHA rather than a mutable tag — verify this is still
        # current before relying on it long-term (see Section 17.3 of the setup guide).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          version: 'v0.72.0'
          # Without this, trivy-action builds the SARIF report with ALL severities
          # regardless of the severity filter above, and exit-code evaluates against
          # that unfiltered set -- so a LOW/MEDIUM finding on any dependency can fail
          # the build even though severity is scoped to CRITICAL,HIGH. Bit us on
          # 2026-07-09 (CVE-2026-10532, a LOW logback finding, failed the build; see
          # CLAUDE.md's Resolved Incident writeup). Documented upstream bug:
          # https://github.com/aquasecurity/trivy-action/issues/309
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-scanning'

  # ──────────────────────────────────────────────
  # Job 4: Update the deploy repo (lower branch)
  # Only runs on pushes to main (not feature branches or PRs)
  # ──────────────────────────────────────────────
  promote-to-lower:
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, marketing-ci, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: lower
          token: ${{ secrets.DEPLOY_REPO_PAT }}
          path: deploy

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: deploy/frontend-build

      - name: Download marketing build
        uses: actions/download-artifact@v8
        with:
          name: marketing-build
          path: deploy/marketing-build

      - name: Update image tag
        run: |
          echo "${{ needs.docker-build.outputs.short_sha }}" > deploy/manifests/image-tag.txt

      - name: Commit and push to deploy repo lower branch
        run: |
          cd deploy
          git config user.name "CI Bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to deploy" && exit 0
          git commit -m "Deploy ${{ needs.docker-build.outputs.short_sha }} to lower

          Source commit: ${{ github.sha }}
          Source repo: ${{ github.repository }}
          Triggered by: ${{ github.actor }}"
          git push origin lower
