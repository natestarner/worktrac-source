name: Mobile CI — iOS simulator build

# Proves the iOS app still compiles and STARTS whenever the code inside it changes, and keeps
# screenshots + the app's console as artifacts, since nobody here has a Mac to look at it on.
#
# - Unsigned (CODE_SIGNING_ALLOWED=NO): a simulator build needs no certificate and no Apple account,
#   so this uses no secrets and is safe on a public repo.
# - "Starts" is read off the screen, by Maestro (e2e/mobile/launch.yaml): the login screen appears and
#   boot-watchdog.js's fallback doesn't. The console can't tell us: a healthy boot logs nothing.
# - Gates TestFlight: mobile-release.yml calls this workflow (workflow_call) and uploads only if it
#   passes. On push it is still not a required check -- macOS runners are slower and flakier than
#   the Linux ones, and a red run here must not block merging an unrelated web fix.
# - Builds against lower's API. The signed store builds come from mobile-release.yml, never from here.
# Full design: docs/architecture/native-apps.md.

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/actions/ios-simulator-app/**'
      - 'e2e/mobile/**'
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

# github.workflow is the CALLER's name under workflow_call, so a release's gate never shares a group
# with push runs on main -- where a newer pending run would cancel it and fail the release.
concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/ios-simulator-app
        with:
          native-api-url: https://api.dev.huddle.fitness

      - name: Boot, launch, screenshot
        run: bash scripts/ios-simulator-smoke.sh build/Build/Products/Debug-iphonesimulator/App.app mobile-ci-out

      - name: The app starts (reaches the login screen)
        run: bash scripts/ios-maestro.sh build/Build/Products/Debug-iphonesimulator/App.app mobile-ci-out/maestro ../e2e/mobile/launch.yaml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator
          path: frontend/mobile-ci-out/
          retention-days: 14
