name: Build the iOS app for the simulator, with Maestro
description: >
  Builds the unsigned simulator app (frontend/build/Build/Products/Debug-iphonesimulator/App.app)
  against NATIVE_API_URL and puts Maestro on the PATH. Shared by mobile-ci.yml (does it start?) and
  mobile-flows.yml (the signed-in flows), so the two can never build the app differently.
  Expects the repo checked out, on a macOS runner.

inputs:
  native-api-url:
    description: The backend the app talks to (baked in; write-native-config.mjs refuses anything but https)
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    # Capacitor 8 is built against Xcode 26; the runner image's default may be older.
    - name: Select newest Xcode
      shell: bash
      run: |
        XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
        if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
        xcodebuild -version

    - name: Build the web bundle and copy it into the iOS project
      shell: bash
      working-directory: frontend
      env:
        NATIVE_API_URL: ${{ inputs.native-api-url }}
      run: |
        npm ci
        npm run build:native
        npx cap sync ios

    - name: Build for simulator (unsigned)
      shell: bash
      working-directory: frontend
      run: |
        set -o pipefail
        xcodebuild \
          -project ios/App/App.xcodeproj \
          -scheme App \
          -configuration Debug \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          build | tail -40

    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    # Straight from the release, checksum-verified, rather than piping get.maestro.mobile.dev to bash.
    # The SHA-256 is the release's checksums_sha256.txt; bump the two together.
    - name: Install Maestro
      shell: bash
      env:
        MAESTRO_VERSION: 2.11.0
        MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
      run: |
        curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
          "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
        echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
        unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
