# The URL scheme that brings someone back from Stripe's hosted checkout in Safari (native-apps.md,
# "Universal links don't bring someone back from Stripe; the URL scheme does").
#
# - It lands on Billing (appLinks.js routes checkout-complete to /app/billing?checkout=...). The
#   session id is fake, so the reconcile fails; the webhook is what applies a real payment.
# - Leaving Billing must STICK. On 2026-10-24 every tab tap re-read the link and bounced back to
#   "Your plan" (#423).
# - NOT checked: billing failing closed with no storefront. The simulator reports the US storefront,
#   so the app is on the 'external' channel and shows prices legitimately (billing.md); the 'none'
#   case can't be produced here (first run, 2026-10-25).
# - Back from Billing goes somewhere (useGoBack), since Billing was reached by a link.
# - #434: some runs saw the link take no effect. With the app's console captured
#   (console-03-checkout-return-link.log), every run where iOS delivered the link shows it reach
#   appLinks.js and land on Billing; the one failure since was iOS's prompt arriving minutes late.
#   If it recurs, read that log first: no "openURLContexts" line means iOS never handed it over.
#
# The unsigned simulator build is the production bundle id, so its scheme is fitness.huddle.app.
appId: fitness.huddle.app
name: Checkout return link lands on Billing and lets go
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_EMAIL_3}
# Opened from History, not from where sign-in lands: if the link is ignored the app stays here, and
# if something sends it to Log afterwards, that shows too. (On Log the two looked the same.)
- tapOn: 'History'
- extendedWaitUntil:
    visible: 'Export data'
    timeout: 30000
- openLink: 'fitness.huddle.app://checkout-complete?session_id=cs_test_maestro_return'
# iOS asks before any custom-scheme link opens an app -- the same prompt a person sees after tapping
# "Return to the Huddle app" in Safari. Left unanswered it also sits over every later flow.
# ⚠️ Waited for, not just tapped: on the runner the prompt has arrived two MINUTES late (run
# 40251542825), after this flow had given up, and then covered the next three flows' login screens.
# The app's console showed no openURLContexts at all, so that run's "ignored link" was the
# simulator, not the app (#434).
- extendedWaitUntil:
    visible: 'Open in .*Huddle.*'
    timeout: 120000
- tapOn: 'Open'
- takeScreenshot: after-open
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: after-open-settled
- extendedWaitUntil:
    visible: '(?i)your plan'
    timeout: 30000


# The bounce: leave, wait, and still be where we went.
- tapOn: 'History'
- extendedWaitUntil:
    visible: 'Export data'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: '(?i)your plan'
- tapOn: 'Log'
- extendedWaitUntil:
    visible: 'Search all exercises'
    timeout: 30000
- assertNotVisible: '(?i)your plan'

# And again from a cold start, where the link is the launch URL (read once per process).
- stopApp
- launchApp:
    arguments:
      huddleConsoleToFile: true
- extendedWaitUntil:
    visible: 'Search all exercises'
    timeout: 60000
- assertNotVisible: '(?i)your plan'
