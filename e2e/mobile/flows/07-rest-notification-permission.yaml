# The first rest timer asks iOS for permission to say "Rest's up" (lib/native/notifications.js). It
# never did on a real phone: Huddle was not even listed under Settings > Notifications, in the App
# Store build (1.3.0) and in TestFlight 1.4.0 (2026-11-25). The other flows could not notice, because
# Maestro grants every permission at launch; this one leaves notifications unset and checks iOS's
# own list of apps that have asked.
#
# app-evidence: the app checked = \[rest-notifications\] permission:
# app-evidence: the app asked iOS = \[rest-notifications\] permission answered
# app-evidence: the adapter FAILED = \[rest-notifications\] failed
appId: fitness.huddle.app
name: The first rest timer asks to send notifications
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_EMAIL_7}
      NOTIFICATIONS: unset
# Log one set (log-a-set.yaml's steps up to the tap; its later steps would run under the alert).
- retry:
    maxRetries: 2
    commands:
      - tapOn: 'Search all exercises'
      - eraseText: 40
      - inputText: 'Barbell Bench Press'
      - extendedWaitUntil:
          visible: '(?i)search results'
          timeout: 10000
- tapOn:
    text: 'Barbell Bench Press'
    below: '(?i)search results'
- extendedWaitUntil:
    visible: 'Weight.*'
    timeout: 30000
# The weight's + (see log-a-set.yaml for why not typing).
- tapOn:
    text: '\+'
    index: 0
- scrollUntilVisible:
    element: 'Log set'
    direction: DOWN
    timeout: 10000
- tapOn: 'Log set'
# Logging the set started the rest timer, which is when the app asks iOS. Maestro accepts system
# permission alerts by itself (the first run's console showed "permission answered: granted" with
# no alert left for this flow to see), so the alert is not the check. The check is the symptom
# from TestFlight: does Settings offer Notifications for Huddle at all? An app that never called
# requestAuthorization has no such row.
# A first set raises its "First Barbell Bench Press" card, and the app never asks over a
# celebration, nor when it is dismissed (TestFlight 1.4 build 34: the alert crowded out a person's
# very first set). Dismiss it, then log the same set again: it beats nothing, so no card, and THAT
# rest is the one that asks.
- tapOn:
    text: 'Nice'
    optional: true
- scrollUntilVisible:
    element: 'Log set.*'
    direction: DOWN
    timeout: 10000
- tapOn: 'Log set.*'
- tapOn:
    text: 'Allow'
    optional: true
- tapOn:
    text: 'Nice'
    optional: true
- assertVisible: 'End workout'
- launchApp:
    appId: com.apple.Preferences
# iOS 27's Settings has no top-level Notifications row (run 4, 2026-11-25): per-app settings live
# under Apps, and an app's page lists "Notifications" only once the app has asked for permission.
- scrollUntilVisible:
    element: '^Apps$'
    direction: DOWN
    timeout: 20000
# Retried: a tap on Apps while Settings was still settling from the scroll was dropped once
# (run 45732972677), leaving Settings on its first page.
- retry:
    maxRetries: 2
    commands:
      - tapOn: '^Apps$'
      # Below the page title, so this never matches the "◀ Huddle" return-to-app link.
      - scrollUntilVisible:
          element:
            text: '^Huddle$'
            below: '^Apps$'
          direction: DOWN
          timeout: 15000
- tapOn:
    text: '^Huddle$'
    below: '^Apps$'
- extendedWaitUntil:
    visible: '^Notifications$'
    timeout: 10000
- takeScreenshot: mobile-flows-out/07-settings-huddle
