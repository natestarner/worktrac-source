# Tapping the Log search opens the exercise search SCREEN: the field at the top, focused by the tap
# (so the keyboard comes up), Cancel beside it, and the results below it, scrolled by the page.
# The search went through three designs before this one; each broke on the app's keyboard
# (docs/architecture/exercise-search-history.md): scrolling the page to the field (builds 33-36),
# then a full-screen layer (1.5.0 builds 38-40: no scroll, then no keyboard). Only the app shows
# its keyboard's resize, so this flow is the gate; Playwright's keyboard-scroll.spec.ts pins the
# layout. Screenshots are taken at intervals after the tap, so anything that arrives and then moves
# shows in the later ones.
#
# app-evidence: the field had the focus = \[search\] screen open, field focused true
appId: fitness.huddle.app
name: Tapping the search opens the search screen
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_EMAIL_9}
- extendedWaitUntil:
    visible: 'Search all exercises'
    timeout: 30000
- takeScreenshot: mobile-flows-out/09-before
# The Log page's search "field" is a button with this label; the screen's own field takes the focus.
- tapOn: 'Search all exercises'
- takeScreenshot: mobile-flows-out/09-just-after
# The screen's Cancel is the sign it opened.
- extendedWaitUntil:
    visible: 'Cancel'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: mobile-flows-out/09-after-settle
# Typed straight in, with no tap on the field first: this only works if the tap's focus held and
# the keyboard came up (TestFlight 1.5.0 build 40 failed exactly here -- no focus, typing went
# nowhere). 'press' matches more of the library than fits above the keyboard, so the scroll below
# has something to do.
- inputText: 'press'
- extendedWaitUntil:
    visible: '(?i)search results'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: mobile-flows-out/09-results
# The field (now holding the text) sits ABOVE the results, and Cancel is still there: the field
# stayed at the top while the keyboard opened and results drew under it.
- assertVisible:
    text: '(?i)search results'
    below: 'Cancel'
- assertVisible: 'Cancel'
# The results SCROLL, with the page, under the field (on 1.5.0 build 38/39 they could not be
# scrolled at all in the app): one swipe with the keyboard up must move them.
- swipe:
    direction: UP
    duration: 800
- takeScreenshot: mobile-flows-out/09-results-scrolled
- assertVisible: 'Cancel'
- assertNotVisible: 'Arnold Press'
# The END of the results can be reached and used. Maestro calls an element "visible" anywhere on
# the screen, INCLUDING behind the keyboard (the first run of this screen passed a
# scrollUntilVisible with the button still under it, 2026-11-26), so visibility alone proves
# nothing here. Instead: put the keyboard away with its Search key (the screen blurs the field on
# Enter, and on iOS hideKeyboard presses that key), scroll to "+ Add your own exercise", and TAP
# it -- a tap on something not really on screen does not open the dialog.
- hideKeyboard
- scrollUntilVisible:
    element: '\+ Add your own exercise'
    direction: DOWN
    # Each swipe-and-look took 9-12s on the runner (2026-11-26).
    timeout: 60000
- takeScreenshot: mobile-flows-out/09-results-end
- tapOn: '\+ Add your own exercise'
- extendedWaitUntil:
    visible: 'Add exercise'
    timeout: 5000
- takeScreenshot: mobile-flows-out/09-add-dialog
- tapOn: 'Close'
- extendedWaitUntil:
    notVisible: 'Add exercise'
    timeout: 5000
# Cancel goes back to the Log page (the typed text stays: it is the person's draft, shown on the
# search button there).
- tapOn: 'Cancel'
- extendedWaitUntil:
    notVisible: '(?i)search results'
    timeout: 5000
- assertNotVisible: 'Cancel'
- takeScreenshot: mobile-flows-out/09-after-cancel
