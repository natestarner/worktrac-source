# Tapping the Log search opens the full-screen search layer (#626): the field pinned at the top,
# Cancel beside it, results scrolling beneath it above the keyboard. It replaced scrolling the PAGE
# to bring the field up, which the app's keyboard defeated about half the time (builds 33-36: the
# WebView shrinks as the keyboard opens, and the scroll clamped). Only the app can show that
# resize, so this flow is the gate; Playwright's keyboard-scroll.spec.ts pins the layout.
# The screenshots are taken at intervals after the tap, so anything that arrives and then moves
# shows in the later ones.
#
# app-evidence: the search layer opened = \[keyboard\] search layer open
appId: fitness.huddle.app
name: Tapping the search opens the full-screen search
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_EMAIL_9}
- extendedWaitUntil:
    visible: 'Search all exercises'
    timeout: 30000
- takeScreenshot: mobile-flows-out/09-before
- tapOn: 'Search all exercises'
- takeScreenshot: mobile-flows-out/09-just-after
# The layer's Cancel is the sign it opened.
- extendedWaitUntil:
    visible: 'Cancel'
    timeout: 5000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: mobile-flows-out/09-after-settle
# 'press' matches more of the library than fits above the keyboard, so the scroll below has
# something to do.
- inputText: 'press'
- extendedWaitUntil:
    visible: '(?i)search results'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: mobile-flows-out/09-results
# The field (now holding the text) sits ABOVE the results, and Cancel is still there: the field
# stayed at the top while the keyboard opened and results drew under it.
- assertVisible:
    text: '(?i)search results'
    below: 'Cancel'
- assertVisible: 'Cancel'
# The results SCROLL, under the pinned field (2026-11-26: on lower they could not be scrolled at
# all in the app -- the layer was sized from a stale visualViewport height, taller than the
# window, so the list fit inside it and ran on under the keyboard). The last control in the
# results starts below the keyboard; Maestro swipes until it is visible, and fails if the list
# never moves. The field and Cancel must still be there after it.
- scrollUntilVisible:
    element: '\+ Add your own exercise'
    direction: DOWN
    timeout: 15000
- takeScreenshot: mobile-flows-out/09-results-scrolled
- assertVisible: 'Cancel'
# Cancel closes it and the picker is back (the typed text stays in the field: it is the person's
# draft, so the field's label may now read "press" rather than its placeholder).
- tapOn: 'Cancel'
- extendedWaitUntil:
    notVisible: '(?i)search results'
    timeout: 5000
- assertNotVisible: 'Cancel'
- takeScreenshot: mobile-flows-out/09-after-cancel
