# Export hands the file to the iOS share sheet (lib/native's saveFile), and dismissing the sheet is
# success, not an error: no "couldn't export" toast afterwards.
appId: fitness.huddle.app
name: Export opens the share sheet
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      EMAIL: ${MAESTRO_EMAIL_5}
# Export is disabled until there is something to export.
- runFlow: ../subflows/log-a-set.yaml
- tapOn: 'History'
- extendedWaitUntil:
    visible: 'Export data'
    timeout: 30000
- tapOn: 'Export data'
# The share sheet covers the app, so the button behind it leaves the accessibility tree. Not "Save to
# Files": on the CI simulator the sheet opens but never draws its contents (2026-10-25), so nothing in
# it can be matched -- and a flow that waits for it leaves the sheet up over the next flow.
- extendedWaitUntil:
    notVisible: 'Export data'
    timeout: 60000
# Dismissed the way a person flicks it away. Dismissing is success, not an error (lib/native saveFile).
# ⚠️ The drag starts ON the sheet, low on the screen. A bare `direction: DOWN` swipe starts high, on
# the dimmed app above a half-height sheet, and moves nothing: the run where the sheet finally drew
# properly (its top at ~57% of the screen) failed on exactly that, and the earlier passes were the
# blank sheet the runner used to draw, which happened to reach up under the swipe (2026-11-04).
- swipe:
    start: 50%, 75%
    end: 50%, 98%
    duration: 600
- waitForAnimationToEnd:
    timeout: 5000
# Still up: tap the dimmed app above it, which also dismisses a sheet. (50%, 12% is the blank strip
# between the logo and "Go Plus" if the sheet has gone after all.)
- runFlow:
    when:
      notVisible: 'Export data'
    commands:
      - tapOn:
          point: 50%, 12%
- extendedWaitUntil:
    visible: 'Export data'
    timeout: 15000
- assertNotVisible: "(?i).*couldn't.*"
