# The app starts: a fresh install, cold, reaches the login screen and not boot-watchdog.js's
# "Huddle couldn't load" fallback. Needs no account and no secret, so it runs on every push in
# mobile-ci.yml and gates every TestFlight upload (mobile-release.yml).
#
# The unsigned simulator build is the committed project, i.e. the production bundle id, pointed at
# lower's API (mobile-ci.yml's NATIVE_API_URL).
appId: fitness.huddle.app
name: Launch reaches the login screen
---
- launchApp:
    clearState: true
# Generous: the first launch after install includes WebKit's own cold start on a shared runner.
# "Forgot password?" first, because the bare text "Log in" is also LoginPage's visually hidden <h1>
# and would pass with no form rendered at all. Then the button itself, below it.
- extendedWaitUntil:
    visible: 'Forgot password\?'
    timeout: 60000
    optional: true
# ONE relaunch if it didn't appear. On a fresh CI simulator the WebView has been seen drawing nothing
# at all -- the background colour for a minute, not even boot-watchdog's fallback, so no JS ran --
# while the same build booted to this screen in the screenshot step moments earlier (#436, 2026-10-25).
# A build that genuinely can't start fails this second launch too (a boot failure is deterministic),
# so the gate still catches it; what it no longer does is block a release on one simulator stall.
- runFlow:
    when:
      notVisible: 'Forgot password\?'
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: 'Forgot password\?'
          timeout: 60000
- assertVisible:
    text: 'Log in'
    below: 'Forgot password\?'
- assertVisible: 'Email'
- assertNotVisible: "Huddle couldn't load"
