# Codifies the local SQL Server container as a reproducible definition. ONE shared server
# process backs every worktree's local stack -- isolation between worktrees comes from each
# using its own DATABASE on this server (see scripts/worktree-env.sh), not from separate
# containers. Running N separate SQL Server containers is exactly what exhausted the host's
# async-I/O budget and crashed every instance when backend test parallelism was first tried
# (see backend/src/test/resources/junit-platform.properties) -- don't "fix" isolation by
# spinning up more containers here.
#
# scripts/db.sh only runs `docker compose up` on a machine that doesn't already have a
# worktrac-sqlserver container (a fresh setup). If one already exists -- e.g. the container
# this project has run manually up to now -- it reuses that container as-is via `docker
# start` instead, so this file introduces a reproducible definition for new setups without
# touching or risking data in an already-running instance.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: worktrac-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalDev123!"
    ports:
      - "1434:1433"
    volumes:
      - worktrac-sqlserver-data:/var/opt/mssql
    healthcheck:
      # -C trusts the container's own self-signed cert -- required by the ODBC 18 tools
      # (mssql-tools18) this image ships, unlike the older mssql-tools package.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  worktrac-sqlserver-data:
