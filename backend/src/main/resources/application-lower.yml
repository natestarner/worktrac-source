spring:
  datasource:
    # No separate username/password here -- SPRING_DATASOURCE_URL (from the
    # SQL_CONNECTION_STRING_LOWER deploy secret) already embeds user=...;password=...
    # in the JDBC URL itself (see worktrac_SDLC_setup_guide.md section 7.8). These used
    # to be set to ${SPRING_DATASOURCE_USERNAME}/${SPRING_DATASOURCE_PASSWORD}, which were
    # never provided by the deploy workflow -- Spring passed the literal unresolved
    # "${SPRING_DATASOURCE_USERNAME}" string to SQL Server as the username, failing login
    # and crash-looping the container on every deploy.
    hikari:
      # Azure SQL free/serverless tiers auto-pause and cold-start on the first
      # connection after idling (see CLAUDE.md) -- give the pool enough time to wait
      # out a resume instead of failing app startup or the first request.
      connection-timeout: 60000
      initialization-fail-timeout: 60000
  jpa:
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true    # never allow clean outside local dev, even in lower env

app:
  email:
    # Same pattern/reasoning as application-local.yml -- not sensitive, safe to commit as a
    # fixed literal. Lower is the other profile e2e actually runs against (the deploy-lower.yml
    # CI job), so it needs this too, not just local.
    e2e-noop-recipient-pattern: '^huddle\+e2e-.*@starner\.co$'
  rate-limit:
    # application.yml's production-sane defaults (10/hour per-IP, 30/hour global) are sized
    # for real internet-facing abuse resistance, not for the e2e-tests CI job, and Playwright's
    # CI retry policy (2 retries per failing test) means a single early 429 cascades into every
    # subsequent test also registering 2-3x -- confirmed live 2026-07-13, when the global cap was
    # exhausted mid-run and failed 14 of 15 tests.
    #
    # WARNING: "one run registers ~15 households" was true when written and is NOT true now.
    # The suite is 109 tests and the teardown reports 107 accounts per run, so ONE run exceeds the
    # 100/hour per-IP cap below. Every registration consumes a token from both buckets:
    # RegistrationService.register() calls checkSendAllowed() unconditionally, and the
    # e2e-noop-recipient-pattern above only skips the ACS send inside EmailService -- it does not
    # bypass the limiter. All of a CI run's registrations also share ONE bucket, because
    # forward-headers-strategy resolves them to the single runner IP.
    #
    # KEEP THIS NUMBER AHEAD OF THE SUITE SIZE. A cap below the per-run registration count fails
    # whichever arbitrary specs happen to run after the bucket empties -- a different set each
    # time, which reads as CI-runner flakiness and gets "fixed" by re-running failed tests (which
    # registers few enough to slip under the cap, hiding the cause). See
    # docs/incidents/2026-08-13-e2e-parallel-flakiness.md for the same mechanism biting locally.
    # lower is internet-facing but has no real users (only e2e CI + manual testing), so it
    # gets headroom sized for CI bursts rather than local's effectively-unlimited 1000/1000 --
    # still meaningfully bounded, unlike local, since lower is a real deployed target.
    # 500/1000 fits ~4 full runs per hour including CI retries, with headroom for the suite to keep
    # growing -- while staying a real bound, unlike local's effectively-unlimited setting, because
    # lower is genuinely internet-facing.
    per-ip-per-hour: 500
    global-email-sends-per-hour: 1000
