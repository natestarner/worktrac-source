spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway manages schema — never change this
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        # All timestamps are stored/compared in UTC (session/set times per CLAUDE.md);
        # pin the JDBC boundary to UTC so java.time.Instant <-> DATETIME2 round-trips
        # consistently regardless of the JVM's local timezone.
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Azure Container Apps' ingress is the sole external entry point for this container --
  # nothing can reach port 8080 directly, bypassing it -- and it sets X-Forwarded-* headers
  # itself on every request it forwards, so trusting them here is safe. "framework" (Spring's
  # own ForwardedHeaderFilter, a plain Servlet Filter) is used instead of Tomcat's
  # RemoteIpValve because a Valve only runs inside a real embedded Tomcat connector and is
  # invisible to MockMvc-based tests (MockMvc drives the filter chain directly, never a real
  # connector) -- RemoteIpValve would make this behavior untestable. Safe locally too: with no
  # reverse proxy in front of `mvn spring-boot:run`, ordinary local requests never carry
  # X-Forwarded-* headers, so this filter has nothing to rewrite and getRemoteAddr() behaves
  # exactly as before. Without this, the per-IP registration/reset rate limiter
  # (RegistrationRateLimiter) bucketed every external user under the ingress's own hop
  # address instead of the real client IP.
  forward-headers-strategy: framework

# Emits the MDC values RequestDiagnosticsFilter and JwtAuthenticationFilter set, so every log line
# a request produces carries the browser's correlation id and (once authenticated) the user id.
# That is what makes a Contact Us submission traceable to its actual request trail in Log Analytics
# instead of correlatable only by timestamp -- see RequestDiagnosticsFilter for the full reasoning,
# and docs/azure-read-only-access.md for the KQL query that uses it.
#
# `logging.pattern.level` is Spring Boot's supported hook for extending the default console pattern,
# which is why there is no logback-spring.xml in this project. Anyone adding one must carry these
# two keys across, or every log line silently loses its correlation id. The `:-` defaults keep
# unauthenticated and untagged requests (health checks, the Event Grid webhook) readable.
logging:
  pattern:
    level: "%5p [cid=%X{cid:-none}] [uid=%X{uid:-anon}]"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:43200}    # 30 days
  email:
    connection-string: ${ACS_EMAIL_CONNECTION_STRING}
    sender-address: ${ACS_EMAIL_SENDER_ADDRESS}
    code-expiration-minutes: ${APP_EMAIL_CODE_EXPIRATION_MINUTES:15}
    app-url: ${APP_EMAIL_APP_URL}
    # Empty (not required) so production startup never depends on this -- the
    # test-support endpoint's controller bean doesn't exist outside local/lower anyway.
    test-support-key: ${E2E_TEST_SUPPORT_KEY:}
    # Empty by default -- see EmailProperties.e2eNoopRecipientPattern. Only local/lower ever
    # set this to a real value.
    e2e-noop-recipient-pattern: ${APP_EMAIL_E2E_NOOP_RECIPIENT_PATTERN:}
  rate-limit:
    per-ip-per-hour: ${APP_RATE_LIMIT_PER_IP_PER_HOUR:10}
    global-email-sends-per-hour: ${APP_RATE_LIMIT_GLOBAL_EMAIL_SENDS_PER_HOUR:30}
    # Contact Us form (ContactRateLimiter). Tighter than the registration limits above because
    # that endpoint is authenticated -- see RateLimitProperties for the sizing reasoning.
    contact-per-user-per-hour: ${APP_RATE_LIMIT_CONTACT_PER_USER_PER_HOUR:5}
    contact-per-ip-per-hour: ${APP_RATE_LIMIT_CONTACT_PER_IP_PER_HOUR:10}
    contact-global-per-hour: ${APP_RATE_LIMIT_CONTACT_GLOBAL_PER_HOUR:20}
  admin:
    # Comma-separated allowlist of admin email addresses -- the real source of truth for
    # who can reach /api/admin/**. Empty by default so an environment with no ADMIN_EMAILS
    # set simply has no admin, rather than defaulting open. Set per-environment in the
    # deploy repo's Container App env vars, never hardcoded here.
    emails: ${ADMIN_EMAILS:}
  billing:
    # Founding households that keep Pro free, by email. Deliberately an env var rather than a
    # Flyway migration: these are other people's personal addresses and have no business in git
    # history, and comping someone later should be a config change rather than a new migration.
    # Set from a deploy SECRET, not a plaintext workflow value. Empty by default -- an environment
    # that sets nothing simply has no comped households.
    comped-emails: ${COMPED_EMAILS:}
  stripe:
    # Every value empty by default: an environment with no Stripe configuration rejects billing
    # requests outright rather than defaulting open (see StripeProperties). Set per-environment in
    # the deploy repo's Container App env vars, never here -- and note keys, price ids and the
    # webhook secret all DIFFER between the Stripe sandbox and the live account.
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    # Local development uses the secret `stripe listen` mints, NOT the one from the Dashboard --
    # a Dashboard endpoint cannot reach localhost.
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-monthly: ${STRIPE_PRICE_MONTHLY:}
    price-yearly: ${STRIPE_PRICE_YEARLY:}
    return-url: ${STRIPE_RETURN_URL:http://localhost:3000/app/billing}
  email-delivery-webhook:
    # Shared-secret query-param key gating the public Event Grid delivery-report webhook (see
    # EmailDeliveryWebhookController) -- empty by default so an environment with no key set
    # simply rejects every call to that endpoint, rather than defaulting open. Set per-environment
    # in the deploy repo's Container App env vars once the matching Event Grid subscription
    # exists; never hardcoded here.
    key: ${EMAIL_DELIVERY_WEBHOOK_KEY:}
