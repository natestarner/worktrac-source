<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Huddle Notice Email</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; padding:40px 0; }
  a { color:#B5542D; }
  a:hover { color:#8f3f1f; }

  @media (prefers-color-scheme: dark) {
    body { background:#0A0807 !important; }
    .email-card { background:#221F1C !important; box-shadow:0 20px 50px rgba(0,0,0,0.5) !important; }
    .email-heading { color:#F2EDE1 !important; }
    .email-body-text { color:#C9C4B8 !important; }
    .footer-tagline { color:#9C978A !important; }
    .footer-copy { color:#726E62 !important; }
  }
</style>
</head>
<body bgcolor="#EDE7DA">

<!--
  One template for the three membership notices: joined a household, an invite was accepted, a
  login was removed. They differ only in heading, body and the label on one button, so they share
  a shape rather than each carrying its own near-identical copy of this markup.

  {{BODY}} is inserted as HTML because two of the three callers need a paragraph break in it. That
  makes escaping the CALLER's job, not this template's -- every one of them runs person, household
  and owner names through escapeHtml before they reach here, because all three are free text a
  household typed.
-->
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center" bgcolor="#F2EDE1" class="email-card" style="width:600px;margin:0 auto;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(28,27,25,0.16);font-family:'Inter',sans-serif;">
<tr><td>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#14100E">
  <tr><td style="padding:24px 44px;">
    <img src="{{LOGO_URL}}" width="231" height="100" alt="Huddle" style="display:block;border:0;outline:none;text-decoration:none;">
  </td></tr>
  </table>

  <div style="padding:48px;">
    <div class="email-heading" style="font-family:'Poppins',sans-serif;font-size:26px;font-weight:700;color:#3E3A37;letter-spacing:-0.01em;margin-bottom:12px;">{{HEADING}}</div>
    <div class="email-body-text" style="font-size:16px;line-height:1.6;color:#3F3A32;margin-bottom:32px;">{{BODY}}</div>

    <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
    <tr><td bgcolor="#E8734A" style="border-radius:12px;">
      <a href="{{CTA_URL}}" style="display:inline-block;color:#FFFFFF;font-size:16px;font-weight:700;padding:16px 40px;text-decoration:none;">{{CTA_LABEL}}</a>
    </td></tr>
    </table>
  </div>

  <div style="padding:24px 48px;text-align:center;">
    <div class="footer-tagline" style="font-size:13px;font-weight:600;color:#78746C;">Log sets fast. Never lose a PR.</div>
    <div class="footer-copy" style="font-size:12px;color:#B0A99A;margin-top:6px;">&copy; 2026 Huddle</div>
  </div>

</td></tr>
</table>

</body>
</html>
