spring:
  datasource:
    # NOTE: host port 1434 (not the default 1433) — this machine already runs another
    # local SQL Server container (inttime-sqlserver) bound to 1433. See section 9.1.
    # Overridable via SPRING_DATASOURCE_URL so each git worktree can point at its own
    # database on the SAME shared SQL Server container (see scripts/worktree-env.sh) --
    # the default below is exactly the primary `main` worktree's database, so a plain
    # `mvn spring-boot:run` with no env vars set behaves exactly as before.
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1434;database=worktrac;encrypt=false;trustServerCertificate=true}
    username: sa
    password: LocalDev123!
    hikari:
      # One local backend serves the WHOLE Playwright suite, and every browser fires a burst
      # of parallel reads on each page load -- so concurrent in-flight requests scale with the
      # worker count, not with "one developer clicking around". Hikari's default of 10 was
      # never sized for that.
      #
      # This matters beyond speed. A saturated pool makes requests queue until they exceed the
      # frontend's REQUEST_TIMEOUT_MS (api/client.js, 15s), and an aborted fetch is a REJECTED
      # fetch -- which is the one thing that trips reachabilityMonitor's lie-fi detection. An
      # overloaded local backend therefore doesn't just make tests slow, it puts the app into a
      # different connectivity state than the test arranged, and the spec fails claiming a
      # resilience bug that does not exist. Sizing the pool above peak worker concurrency keeps
      # "the machine is busy" from ever being reported as "the app went offline".
      maximum-pool-size: ${DB_POOL_SIZE:40}
      # minimum-idle MUST stay explicitly low. Hikari defaults it to maximum-pool-size and fills
      # that many connections eagerly at startup -- and this profile is also what every
      # @SpringBootTest activates (see AbstractIntegrationTest). Each of those test classes
      # resolves its own datasource URL and so gets its OWN Spring context and its OWN pool, all
      # alive at once in Spring's test-context cache. Left at the default, a backend test run
      # would open ~40 connections per context against the single shared testcontainer -- the
      # same "exhaust the host's I/O budget" failure that class-level test parallelism caused
      # once already (see junit-platform.properties). Growing on demand costs the e2e suite
      # nothing: the pool reaches its ceiling within the first seconds of load.
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway manages schema
    # Off by default, opt in with SHOW_SQL=true. This echoes every statement through a
    # synchronous appender: during a full e2e run it was 89% of all backend log output
    # (7461 of 8414 lines), paid on the request path, for output nothing reads unless
    # someone is actively debugging a query. lower/production already set it false.
    show-sql: ${SHOW_SQL:false}
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: false    # OK to allow clean locally (never in prod)

app:
  jwt:
    # Local-dev-only secret. NEVER reuse this value in lower/production -- those must set
    # APP_JWT_SECRET via a real secret store (see CLAUDE.md: never commit real secrets).
    secret: local-dev-only-insecure-jwt-signing-secret-do-not-use-elsewhere-0123456789
  email:
    # There's no safe fake value for actually sending mail -- registration sends a real email
    # through Azure Communication Services even locally, so set real ACS_EMAIL_CONNECTION_STRING/
    # ACS_EMAIL_SENDER_ADDRESS env vars on your machine to run the app and get a real code
    # (a free-tier ACS resource is fine). The `:` empty fallback below exists ONLY so
    # @SpringBootTest classes -- which also activate this "local" profile, and mock EmailService
    # out entirely (see e.g. RegistrationServiceTest) rather than calling real Azure -- don't
    # fail at context startup in CI, where no such env var exists. A real env var you set
    # locally always wins over this fallback; it does not weaken the "real send" decision for
    # actually running the app.
    connection-string: ${ACS_EMAIL_CONNECTION_STRING:}
    sender-address: ${ACS_EMAIL_SENDER_ADDRESS:}
    app-url: ${APP_EMAIL_APP_URL:http://localhost:3000/app/log}
    # test-support-key is different: it only gates the local-only test-support endpoint on
    # your own machine, so (like the JWT secret above) a fixed, committed placeholder is safe.
    test-support-key: local-dev-only-e2e-test-key-do-not-use-elsewhere
    # Not sensitive (it's a recipient-matching pattern, not a secret) -- safe to commit as a
    # fixed literal, same reasoning as test-support-key above. Matches exactly what
    # e2e/tests/support/auth.ts's registerHousehold generates; livewiretest addresses
    # (live-email-canary.spec.ts) deliberately don't match, so that one spec still sends for
    # real. Single-quoted so YAML doesn't try to interpret the backslashes.
    # Also matches the local ADMIN_EMAILS default below, because the Contact Us alert
    # (ContactEmailEventListener) mails the ADMIN address rather than the submitter -- so without
    # this, every local e2e run of contact.spec.ts would send a real ACS message. The registration
    # admin alerts route through the same sendAdminAlert and are no-op'd locally for the same
    # reason. If you override ADMIN_EMAILS locally, widen this too or expect real mail.
    e2e-noop-recipient-pattern: '^(huddle\+e2e-.*|nate\+huddleadmin)@starner\.co$'
  rate-limit:
    # Rate limiting defends a deployed, internet-facing environment against abuse -- that's
    # not the threat model for a single developer or an automated test suite hitting
    # localhost. @SpringBootTest classes reuse one Spring context (and its rate limiter's
    # stateful buckets) across every test method in the file, so the production-sane defaults
    # in application.yml would otherwise start rejecting unrelated tests with 429s partway
    # through a file purely because earlier tests in the same class already consumed the
    # quota. The one test class that actually verifies rate-limiting behavior overrides these
    # back down via its own property source, which gives it an isolated Spring context.
    #
    # 1000 was not enough, and the way it ran out is why e2e flakiness LOOKED like a
    # parallelism bug. Every e2e test registers its own household, so a full suite spends ~109
    # tokens from each bucket, and every local run shares the same two buckets (one backend,
    # one source IP). They refill greedily at capacity/hour, so what matters is how long a run
    # takes:
    #   - at 1 worker  a suite takes ~8 min and refills ~130 tokens while spending 109 -- it
    #     roughly breaks even, and you can iterate all day
    #   - at 11 workers the same suite takes ~1 min and refills ~17 while spending the same 109
    # So the FASTER the suite runs, the sooner registrations start coming back 429. That is a
    # real mechanism by which "it only passes at workers=1" is true while nothing is actually
    # wrong with parallelism -- and it surfaces as registerHousehold failing in whichever
    # arbitrary specs happened to run after the bucket emptied, i.e. a different set of tests
    # every time, which reads exactly like a data-isolation problem and is not one.
    #
    # There is no abuse to defend against on localhost, so this is a ceiling no local suite can
    # reach rather than one that merely looks generous.
    per-ip-per-hour: 100000
    global-email-sends-per-hour: 100000
    # Same reasoning as the two above: @SpringBootTest classes share one Spring context and
    # therefore one set of stateful buckets across every test method in the file, so the
    # production-sane defaults would start 429ing unrelated tests partway through a class purely
    # because earlier ones spent the quota. ContactRateLimitTest overrides these back down via its
    # own property source, which gives it an isolated context.
    contact-per-user-per-hour: 100000
    contact-per-ip-per-hour: 100000
    contact-global-per-hour: 100000
  admin:
    emails: ${ADMIN_EMAILS:nate+huddleadmin@starner.co}
  email-delivery-webhook:
    # Local dev/tests never receive a real Event Grid callback (it's cloud-only), so a fixed,
    # committed placeholder is safe here the same way jwt.secret and test-support-key above are.
    key: local-dev-only-webhook-key-do-not-use-elsewhere
