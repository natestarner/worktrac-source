# Run test classes concurrently -- every class extends AbstractIntegrationTest, which shares
# ONE singleton MSSQLServerContainer for the whole JVM (see that class's Javadoc) with each
# class getting its own isolated database + Spring context on it. Methods within a class stay
# sequential (same_thread) since they share one Spring context and haven't been audited for
# concurrent-safety against each other.
#
# parallelism is deliberately back at 1, not the 4 it briefly was, after TWO independent,
# real concurrency bugs surfaced empirically once class parallelism was tried:
#   1. Spring Boot's LogbackLoggingSystem resets the JVM-shared Logback LoggerContext on every
#      new Spring context's startup, silently detaching LogCaptor's appender if another class's
#      context boots concurrently (fixed by marking the one LogCaptor-using class @Isolated --
#      see AuthControllerRateLimitTest and CLAUDE.md's Testing section).
#   2. A SECOND, independent Mockito "UnfinishedStubbing" failure surfaced on the real CI
#      runner (ubuntu-latest) in PasswordResetControllerTest -- never reproduced across 8+
#      consecutive local runs, strongly suggesting it's sensitive to CI's specific core
#      count/scheduling rather than something reliably reproducible for a fix-and-verify cycle
#      on a dev machine. Root cause not yet confirmed (plausibly Mockito's inline-mock-maker
#      bytecode instrumentation -- a JVM-wide, not per-thread, mechanism -- racing across
#      multiple Spring contexts' @MockitoBean setup during concurrent context refresh).
# Given (2) can't yet be reliably reproduced/verified outside CI, the correctness-first choice
# is parallelism=1 until each of the 24 classes has been individually audited for
# concurrent-safety (Mockito usage, shared static/JVM-wide state, etc.) -- not just container
# isolation, which IS already fully solved (singleton container + per-class DB remains a large,
# real win on its own: local full-suite runs went from the old N-container baseline to
# consistently ~2 minutes even at parallelism=1, since the 24-separate-container startup cost
# is what parallelism=4 was optimizing away, not something parallelism=1 reintroduces).
# Re-enabling parallelism again needs: (a) root-causing the Mockito failure with certainty,
# (b) an explicit audit of the other 23 classes for the same two failure classes, (c) several
# green CI (not just local) runs at the target parallelism before trusting it as a required
# check.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=1
