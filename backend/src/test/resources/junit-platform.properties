# Run test classes concurrently -- every class extends AbstractIntegrationTest, which shares
# ONE singleton MSSQLServerContainer for the whole JVM (see that class's Javadoc) with each
# class getting its own isolated database + Spring context on it. Methods within a class stay
# sequential (same_thread) since they share one Spring context and haven't been audited for
# concurrent-safety against each other.
#
# parallelism was previously pinned to 1 because the OLD test design (one MSSQLServerContainer
# PER class, 24 of them) pushed a 4-way run over the host's available async-I/O resources and
# crashed every container outright ("Unable to create a new asynchronous I/O context...
# increase sysctl fs.aio-max-nr") -- see git history on this file for the full incident. That
# failure mode was specifically about running N separate SQL Server *processes* concurrently,
# each needing its own aio context; it doesn't apply to N threads sharing ONE already-running
# SQL Server process, which is a much more ordinary kind of concurrent load. Re-measure if this
# is raised further: if `fs.aio-max-nr` in the Docker Desktop WSL2 VM is low (see
# docs/DEVELOPMENT.md / scripts/doctor.sh), prefer raising that over lowering this back down.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
